name: CI

on:
  push:
    branches: [ 'main' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ 'main' ]
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/prompt-evaluator:${{ github.sha }} .
          docker tag ghcr.io/${{ github.repository_owner }}/prompt-evaluator:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/prompt-evaluator:latest
      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/prompt-evaluator:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/prompt-evaluator:latest

  release:
    name: Release - build & push tagged image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push release Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/prompt-evaluator:${{ github.ref_name }} .
          docker tag ghcr.io/${{ github.repository_owner }}/prompt-evaluator:${{ github.ref_name }} ghcr.io/${{ github.repository_owner }}/prompt-evaluator:latest
          docker push ghcr.io/${{ github.repository_owner }}/prompt-evaluator:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository_owner }}/prompt-evaluator:latest
      - name: Generate changelog from merged PRs
        uses: actions/github-script@v6.2.0
        with:
          script: |
            const core = require('@actions/core');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // determine current tag/name
            let current = process.env.GITHUB_REF_NAME || context.ref || '';
            if (current.startsWith('refs/tags/')) current = current.replace('refs/tags/', '');
            if (!current && github.event && github.event.release && github.event.release.tag_name) {
              current = github.event.release.tag_name;
            }
            core.info(`Current ref/tag: ${current}`);

            // fetch tags and find previous tag
            const tagsResp = await github.rest.repos.listTags({ owner, repo, per_page: 100 });
            const tagNames = tagsResp.data.map(t => t.name);
            let previous = null;
            const idx = tagNames.indexOf(current);
            if (idx !== -1 && idx + 1 < tagNames.length) previous = tagNames[idx + 1];
            if (!previous) {
              core.info('No previous tag found; will collect recent merged PRs instead');
            } else {
              core.info(`Previous tag detected: ${previous}`);
            }

            // helper to fetch PR details
            async function fetchPR(num) {
              try {
                const pr = await github.rest.pulls.get({ owner, repo, pull_number: num });
                return pr.data;
              } catch (e) {
                core.warning(`Failed to fetch PR #${num}: ${e}`);
                return null;
              }
            }

            // gather PR numbers
            const prNumbers = new Set();
            if (previous) {
              const compare = await github.rest.repos.compareCommits({ owner, repo, base: previous, head: current });
              const commits = compare.data.commits || [];
              for (const c of commits) {
                try {
                  const res = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: c.sha });
                  for (const pr of res.data) prNumbers.add(pr.number);
                } catch (e) {
                  core.warning(`Failed to list PRs for commit ${c.sha}: ${e}`);
                }
              }
            }

            // fallback: list recent merged PRs since previous tag date or last 50 PRs
            if (prNumbers.size === 0) {
              core.info('Falling back to listing recent merged PRs');
              const prs = await github.rest.pulls.list({ owner, repo, state: 'closed', per_page: 100 });
              for (const pr of prs.data) {
                if (pr.merged_at) {
                  // if previous exists, only include PRs merged after previous tag date
                  if (previous && tagsResp.data) {
                    const prevTag = tagsResp.data.find(t => t.name === previous);
                    if (prevTag && prevTag.commit && prevTag.commit.sha) {
                      // best-effort: include recent merged PRs
                      prNumbers.add(pr.number);
                    } else {
                      prNumbers.add(pr.number);
                    }
                  } else {
                    prNumbers.add(pr.number);
                  }
                }
                if (prNumbers.size >= 50) break;
              }
            }

            // fetch PR details and group by label categories
            const groups = { Features: [], 'Bug Fixes': [], Docs: [], Chores: [], Other: [] };
            const labelMap = {
              Features: ['feature', 'enhancement'],
              'Bug Fixes': ['bug', 'fix'],
              Docs: ['docs', 'documentation'],
              Chores: ['chore', 'refactor', 'ci']
            };

            for (const num of prNumbers) {
              const pr = await fetchPR(num);
              if (!pr) continue;
              const labels = (pr.labels || []).map(l => (typeof l === 'string' ? l : l.name));
              let placed = false;
              for (const [group, keys] of Object.entries(labelMap)) {
                if (labels.some(lbl => keys.includes(lbl.toLowerCase()))) {
                  groups[group].push(pr);
                  placed = true;
                  break;
                }
              }
              if (!placed) groups.Other.push(pr);
            }

            // format changelog
            function fmtPR(pr) {
              const title = pr.title.split('\n')[0];
              const num = pr.number;
              const url = pr.html_url;
              const user = pr.user ? pr.user.login : 'unknown';
              const labels = (pr.labels || []).map(l => (typeof l === 'string' ? l : l.name)).join(', ');
              return `- [#${num}](${url}) ${title} (by @${user})${labels ? ` — _${labels}_` : ''}`;
            }

            let bodySections = [];
            for (const [section, prs] of Object.entries(groups)) {
              if (prs.length === 0) continue;
              bodySections.push(`### ${section}\n` + prs.map(fmtPR).join('\n'));
            }
            const body = bodySections.join('\n\n') || 'No significant changes detected.';
            core.exportVariable('CHANGELOG', body);
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: |
            Automated release generated by CI for ${{ github.ref_name }}.

            Changes:
            ${{ env.CHANGELOG }}
          draft: false
          prerelease: false
